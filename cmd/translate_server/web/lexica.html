<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lexica · 选词即译</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>

  <link rel="stylesheet" href="lexica.css">
  <link rel="stylesheet" href="markdown-theme.css">
</head>

<body>

  <div id="lang-transition-overlay" aria-hidden="true">
    <div class="lang-transition-ring"></div>
    <div class="lang-transition-text" id="lang-transition-text"></div>
  </div>

  <header>
    <h1 class="brand" id="brand-logo" title="点击切换 英中 / 日语 学习模式">
      <span class="mark">L</span><span id="brand-name">exica</span>
      <span class="subtitle" id="brand-subtitle">— select to read</span>
    </h1>
    <div class="controls">
      <div class="ctrl">
        <span class="ctrl-label">API</span>
        <input type="text" id="api-url" value="http://127.0.0.1:8080" size="22">
      </div>
      <div class="ctrl">
        <span class="ctrl-label">Delay</span>
        <input type="number" id="delay" value="250" min="0" max="2000" step="50" style="width: 56px">
        <span style="font-size: 10px; color: var(--ink-soft)">ms</span>
      </div>
      <label class="toggle" title="选中即朗读">
        <input type="checkbox" id="autoplay" checked>
        <span class="switch"></span>
        <span class="ctrl-label">Play</span>
      </label>
      <input type="file" id="file-input" accept=".txt,.csv,.md,.markdown,.pdf,.docx,.epub" hidden>
      <button id="load-btn" class="primary">打开文件</button>
      <input type="file" id="table-file-input" accept=".md,.markdown" hidden>
      <button id="table-read-btn" title="打开 Markdown 表格，用方向键移动高亮框自动朗读英文格">📊 表格朗读</button>
      <div class="recent-wrap">
        <button id="recent-btn" title="最近打开过的文件">最近 ▾</button>
        <div id="recent-menu" class="recent-menu hidden"></div>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <aside class="library" aria-label="Navigation">
      <div class="sidebar-tabs">
        <button class="sidebar-tab" id="tab-dict-strict" title="听写·基础 · 看中文拼英文">
          <span class="tab-icon">✍️</span>听写·基础
        </button>
        <button class="sidebar-tab" id="tab-dict-advanced" title="听写·进阶 · 听音频拼英文">
          <span class="tab-icon">🎧</span>听写·进阶
        </button>
        <button class="sidebar-tab" id="tab-dict-ultimate" title="听写·终极 · 听音频写中文，自己判定">
          <span class="tab-icon">🧠</span>听写·终极
        </button>
        <button class="sidebar-tab" id="tab-learn" title="学习新词·按顺序认词">
          <span class="tab-icon">📖</span>新词
        </button>
        <button class="sidebar-tab" id="tab-recog" title="认词·看英文标认识">
          <span class="tab-icon">👁️</span>认词
        </button>
        <button class="sidebar-tab" id="tab-study" title="学词·中英文同时显示 · 空格/回车下一个">
          <span class="tab-icon">🔖</span>学词
        </button>
      </div>

      <!-- Home-screen background picker -->
      <div class="bg-picker">
        <button class="bg-picker-btn" id="bg-picker-btn" title="切换主页背景">
          🎨 背景：<span id="bg-picker-label">日出日落</span> ▾
        </button>
        <div class="bg-picker-menu hidden" id="bg-picker-menu">
          <button class="bg-picker-opt" data-bg="sun">🌅 日出日落</button>
          <button class="bg-picker-opt" data-bg="letters">🔤 字母进度</button>
        </div>
      </div>

      <!-- Tab 2 & 3: Dictation info -->
      <div class="sidebar-content hidden" id="sidebar-dict-info">
        <div style="text-align:center;padding:32px 12px;color:var(--ink-soft);">
          <div style="font-size:32px;margin-bottom:12px;">✏️</div>
          <div
            style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;"
            id="sidebar-dict-mode-label">听写模式</div>
          <div style="font-size:13px;line-height:1.6;" id="sidebar-dict-mode-desc"></div>
        </div>
      </div>

      <!-- Tab: Learn new words info -->
      <div class="sidebar-content hidden" id="sidebar-learn-info">
        <div style="text-align:center;padding:32px 12px;color:var(--ink-soft);">
          <div style="font-size:32px;margin-bottom:12px;">📖</div>
          <div
            style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;">
            学习新词</div>
          <div style="font-size:13px;line-height:1.6;" id="sidebar-learn-desc">按原始顺序逐词过，标记认识或不认识。</div>
        </div>
      </div>

      <!-- Tab 4: Recognition info -->
      <div class="sidebar-content hidden" id="sidebar-recog-info">
        <div style="text-align:center;padding:32px 12px;color:var(--ink-soft);">
          <div style="font-size:32px;margin-bottom:12px;">👁️</div>
          <div
            style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;">
            认词模式</div>
          <div style="font-size:13px;line-height:1.6;" id="sidebar-recog-desc">看到英文，标记认识或不认识。</div>
        </div>
      </div>

      <!-- Tab: Study (browse) info -->
      <div class="sidebar-content hidden" id="sidebar-study-info">
        <div style="text-align:center;padding:32px 12px;color:var(--ink-soft);">
          <div style="font-size:32px;margin-bottom:12px;">🔖</div>
          <div
            style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;">
            学词</div>
          <div style="font-size:13px;line-height:1.6;" id="sidebar-study-desc">中英文同时显示，空格或回车看下一个，按 R 朗读。不计成绩。</div>
        </div>
      </div>

    </aside>

    <div id="sidebar-divider" class="sidebar-divider" title="拖动调整 · 点击按钮折叠">
      <button id="sidebar-toggle" class="sidebar-toggle" title="折叠/展开侧边栏">‹</button>
    </div>

    <main>
      <div id="status">
        <div class="hint-ornament">❦ · ❦ · ❦</div>
        <h2 class="hint-title">A reader for your wordlists.</h2>
        <p class="hint-sub">选中文字即朗读 · 翻译自动弹出</p>
        <div class="hint-formats">
          <span>txt</span><span>csv</span><span>md</span><span>pdf</span><span>docx</span><span>epub</span>
        </div>
      </div>
    </main>
  </div>

  <div id="popup">
    <div id="popup-header">
      <div id="popup-word"></div>
      <div class="popup-actions">
        <button id="replay-btn" class="icon-only" title="再读一次 (R)">↻</button>
        <button id="save-btn" title="加入错题本">✚ 收藏</button>
        <button id="close-btn" class="icon-only" title="关闭 (Esc)">✕</button>
      </div>
    </div>
    <iframe id="popup-frame" sandbox="allow-same-origin allow-scripts allow-popups"></iframe>
    <div id="popup-loading">查询中</div>
  </div>

  <!-- Reader Panel (opened files float here; background stays behind) -->
  <div id="reader-panel">
    <div id="reader-header">
      <div id="reader-title">阅读</div>
      <div class="popup-actions">
        <button id="reader-close-btn" class="icon-only" title="关闭">✕</button>
      </div>
    </div>
    <div id="reader-tablebar" class="hidden">↑↓←→ / hjkl 移动 · 空格=下 回车=上 · 英文格自动朗读 · R 重读 · Esc 退出</div>
    <div id="reader-body">
      <div id="content"></div>
    </div>
  </div>

  <!-- Learn Panel -->
  <div id="learn-panel">
    <div id="learn-header">
      <div id="learn-title">学习新词</div>
      <div class="popup-actions">
        <button id="learn-close-btn" class="icon-only" title="关闭">✕</button>
      </div>
    </div>
    <div id="learn-body">
      <!-- Screens injected by JS -->
    </div>
  </div>

  <!-- Recognition Panel -->
  <div id="recognition-panel">
    <div id="recog-header">
      <div id="recog-title">认词模式</div>
      <div class="popup-actions">
        <button id="recog-close-btn" class="icon-only" title="关闭">✕</button>
      </div>
    </div>
    <div id="recog-body">
      <!-- Screens injected by JS -->
    </div>
  </div>

  <!-- Study Panel -->
  <div id="study-panel">
    <div id="study-header">
      <div id="study-title">学词</div>
      <div class="popup-actions">
        <button id="study-close-btn" class="icon-only" title="关闭">✕</button>
      </div>
    </div>
    <div id="study-body">
      <!-- Screens injected by JS -->
    </div>
  </div>

  <!-- Dictation Panel -->
  <div id="dictation-panel">
    <div id="dict-header">
      <div id="dict-title">听写模式</div>
      <div class="popup-actions">
        <button id="dict-close-btn" class="icon-only" title="关闭">✕</button>
      </div>
    </div>
    <div id="dict-body">
      <!-- Screens injected by JS -->
    </div>
  </div>

  <script src="lexica.js"></script>
</body>

</html>
