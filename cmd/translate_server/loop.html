<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop</title>
<style>
  /* Warm low-contrast palette (Gruvbox-inspired) — easy on the eyes
     for long ambient viewing on a secondary screen. */
  :root {
    --bg:          #282828;
    --bg-elev:     #32302f;
    --text:        #ebdbb2;
    --text-soft:   #a89984;
    --text-faint:  #665c54;
    --border:      #504945;
    --accent:      #d5c4a1;
    --accent-warm: #fabd2f;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    font-family: 'Helvetica Neue', Arial, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* --- Setup screen --- */
  #setup {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    gap: 14px;
  }
  #setup.hidden { display: none; }

  .setup-title {
    font-size: 14px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-soft);
    margin-bottom: 12px;
  }
  .setup-label {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-soft);
    align-self: flex-start;
    width: min(640px, 90vw);
  }
  .setup-input, .setup-textarea {
    width: min(640px, 90vw);
    padding: 12px 14px;
    background: var(--bg-elev);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'Menlo', 'Monaco', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  .setup-input::placeholder, .setup-textarea::placeholder { color: var(--text-faint); }
  .setup-input:focus, .setup-textarea:focus { border-color: var(--accent); }
  .setup-textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
  .setup-row {
    width: min(640px, 90vw);
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .setup-btn {
    padding: 10px 22px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    font-size: 13px;
    letter-spacing: 0.06em;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .setup-btn:hover { background: var(--text); }
  .setup-interval {
    width: 90px;
  }
  .setup-divider {
    width: min(640px, 90vw);
    height: 1px;
    background: var(--border);
    margin: 10px 0;
    opacity: 0.5;
  }
  .setup-msg {
    width: min(640px, 90vw);
    min-height: 18px;
    font-size: 12px;
    color: var(--text-soft);
    font-family: 'Menlo', 'Monaco', monospace;
  }
  .setup-msg.err { color: #fb4934; }

  /* --- Display screen (the main event) --- */
  #stage {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  #stage.hidden { display: none; }

  .word-box {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .word-fit {
    white-space: nowrap;
    line-height: 1;
    font-weight: 600;
    text-align: center;
    transform-origin: center center;
    will-change: transform, font-size;
    letter-spacing: -0.01em;
    user-select: none;
  }

  .word-en { color: var(--text); }
  .word-zh { color: var(--accent); font-weight: 500; }

  /* Faint exit button — fades in on hover/mousemove */
  #exit-btn {
    position: fixed;
    top: 14px;
    right: 18px;
    background: transparent;
    color: var(--text-faint);
    border: none;
    font-size: 22px;
    cursor: pointer;
    padding: 6px 10px;
    opacity: 0;
    transition: opacity 0.3s, color 0.15s;
    z-index: 10;
    font-family: inherit;
  }
  #exit-btn:hover { color: var(--text); }
  body.show-controls #exit-btn { opacity: 0.65; }
</style>
</head>
<body>

<div id="setup">
  <div class="setup-title">LOOP</div>

  <div class="setup-label">间隔（秒）</div>
  <input type="number" class="setup-input setup-interval" id="interval" value="5" min="1" max="3600" step="1">

  <div class="setup-divider"></div>

  <div class="setup-label">本地 CSV 路径</div>
  <input type="text" class="setup-input" id="path" placeholder="/Users/.../words.csv" autocomplete="off" spellcheck="false">
  <div class="setup-row">
    <button class="setup-btn" id="load-path">从文件加载</button>
  </div>

  <div class="setup-divider"></div>

  <div class="setup-label">粘贴 CSV 文本</div>
  <textarea class="setup-textarea" id="csv" placeholder="English,Chinese — 表头可有可无"></textarea>
  <div class="setup-row">
    <button class="setup-btn" id="load-csv">从文本加载</button>
  </div>

  <div class="setup-divider"></div>
  <div class="setup-msg" id="msg"></div>
</div>

<div id="stage" class="hidden">
  <div class="word-box" id="en-box"><div class="word-fit word-en" id="en"></div></div>
  <div class="word-box" id="zh-box"><div class="word-fit word-zh" id="zh"></div></div>
</div>

<button id="exit-btn" title="回到设置 (Esc)">⌂</button>

<script>
const $ = id => document.getElementById(id);

// --- State ---
let words = [];
let idx = 0;
let intervalMs = 5000;
let timer = null;
let paused = false;

// --- LocalStorage keys ---
const LS = {
  words:    'loop.words',
  interval: 'loop.interval',
  path:     'loop.path',
};

// --- CSV parsing (lenient: 2 cols, optional header) ---
function parseCSV(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') inQ = false;
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }

  const out = [];
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.length < 2) continue;
    const en = String(r[0] || '').trim();
    const zh = String(r[1] || '').trim();
    if (!en) continue;
    if (i === 0 && /^english$/i.test(en)) continue;
    out.push({ english: en, chinese: zh });
  }
  return out;
}

// --- Setup screen handlers ---
const setupEl = $('setup');
const stageEl = $('stage');
const msgEl = $('msg');
const intervalInput = $('interval');
const pathInput = $('path');
const csvInput = $('csv');

function setMsg(text, isErr) {
  msgEl.textContent = text || '';
  msgEl.classList.toggle('err', !!isErr);
}

function getInterval() {
  const v = parseInt(intervalInput.value, 10);
  return (isFinite(v) && v > 0) ? v : 5;
}

// Restore previous values
intervalInput.value = parseInt(localStorage.getItem(LS.interval) || '5', 10);
pathInput.value = localStorage.getItem(LS.path) || '';

$('load-path').addEventListener('click', async () => {
  let path = pathInput.value.trim();
  if (path.startsWith("'") && path.endsWith("'") && path.length >= 2) {
    path = path.slice(1, -1).trim();
  }
  if (!path) { setMsg('请输入 CSV 路径', true); return; }
  setMsg('加载中...');
  try {
    const res = await fetch('/dictation/load-csv', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path }),
    });
    if (!res.ok) {
      const body = (await res.text()).trim();
      throw new Error(body || ('HTTP ' + res.status));
    }
    const list = await res.json();
    if (!list || !list.length) throw new Error('CSV 中没有单词');
    localStorage.setItem(LS.path, path);
    start(list);
  } catch (err) {
    setMsg('✕ ' + (err.message || err), true);
  }
});

$('load-csv').addEventListener('click', () => {
  const text = csvInput.value.trim();
  if (!text) { setMsg('请粘贴 CSV 内容', true); return; }
  const list = parseCSV(text);
  if (!list.length) { setMsg('✕ 未解析到任何单词', true); return; }
  start(list);
});

// --- Start cycling ---
function start(list) {
  // Shuffle for freshness
  const shuffled = [...list];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  words = shuffled;
  idx = 0;
  intervalMs = Math.max(1, getInterval()) * 1000;
  paused = false;

  // Persist
  try {
    localStorage.setItem(LS.words, JSON.stringify(words));
    localStorage.setItem(LS.interval, String(getInterval()));
  } catch (_) { /* quota? ignore */ }

  setupEl.classList.add('hidden');
  stageEl.classList.remove('hidden');
  render();
  startCycle();
}

function backToSetup() {
  stopCycle();
  stageEl.classList.add('hidden');
  setupEl.classList.remove('hidden');
  setMsg('');
}

// --- Render current word ---
function render() {
  const w = words[idx];
  if (!w) return;
  const enEl = $('en');
  const zhEl = $('zh');
  enEl.textContent = w.english;
  zhEl.textContent = w.chinese || '';
  requestAnimationFrame(() => {
    fit(enEl, $('en-box'));
    fit(zhEl, $('zh-box'));
  });
}

// --- Auto-fit text to fill its box (single line) ---
function fit(textEl, boxEl) {
  if (!textEl || !boxEl) return;
  textEl.style.transform = '';
  const boxW = boxEl.clientWidth;
  const boxH = boxEl.clientHeight;
  if (boxW <= 0 || boxH <= 0) return;
  // Aim for the text height to be ~80% of the box height
  const baseFont = Math.max(24, boxH * 0.8);
  textEl.style.fontSize = baseFont + 'px';
  const textW = textEl.scrollWidth;
  const targetW = boxW * 0.94;
  if (textW > targetW) {
    const scale = targetW / textW;
    textEl.style.transform = `scale(${scale})`;
  }
}

// --- Cycle timer ---
function startCycle() {
  stopCycle();
  if (paused) return;
  timer = setInterval(() => {
    if (paused) return;
    idx = (idx + 1) % words.length;
    render();
  }, intervalMs);
}
function stopCycle() {
  if (timer) { clearInterval(timer); timer = null; }
}

function step(dir) {
  if (!words.length) return;
  idx = (idx + dir + words.length) % words.length;
  render();
  if (!paused) startCycle();
}
function togglePause() {
  paused = !paused;
  if (paused) stopCycle();
  else startCycle();
}

// --- Keyboard controls (hidden by design, power-user only) ---
window.addEventListener('keydown', (e) => {
  if (stageEl.classList.contains('hidden')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); step(+1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if (e.key === ' ') { e.preventDefault(); togglePause(); }
  else if (e.key === 'Escape') { e.preventDefault(); backToSetup(); }
});

// --- Exit button (only visible briefly after mouse moves) ---
$('exit-btn').addEventListener('click', backToSetup);

let hideControlsTimer = null;
function showControlsBriefly() {
  document.body.classList.add('show-controls');
  if (hideControlsTimer) clearTimeout(hideControlsTimer);
  hideControlsTimer = setTimeout(() => document.body.classList.remove('show-controls'), 2200);
}
window.addEventListener('mousemove', showControlsBriefly);

// --- Re-fit on resize ---
window.addEventListener('resize', () => {
  if (!stageEl.classList.contains('hidden')) render();
});

function loadWordsAndShow(list) {
  if (!Array.isArray(list) || !list.length) return;
  words = list;
  idx = 0;
  paused = false;
  intervalMs = Math.max(1, getInterval()) * 1000;
  setupEl.classList.add('hidden');
  stageEl.classList.remove('hidden');
  render();
  startCycle();
}

// --- Auto-restore previous session on page load ---
(function tryRestore() {
  try {
    const raw = localStorage.getItem(LS.words);
    if (!raw) return;
    loadWordsAndShow(JSON.parse(raw));
  } catch (_) { /* ignore */ }
})();

// --- Listen for word lists pushed from other tabs (dictation/recognition
//     summary screens write to localStorage and open /loop) ---
window.addEventListener('storage', (e) => {
  if (e.key !== LS.words || !e.newValue) return;
  try { loadWordsAndShow(JSON.parse(e.newValue)); } catch (_) { /* ignore */ }
});
</script>
</body>
</html>
