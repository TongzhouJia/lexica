services:
  lexica:
    build: .
    image: lexica:latest
    container_name: lexica
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: "0.0.0.0:8080"
      # Uncomment together with the 学外语 volume below to enable /clean:
      # LINGO_BASE_DIR: "/app/lingo"
    volumes:
      - ./.env:/app/.env:ro
      - ./credentials:/app/credentials  # writable so Gmail token refresh can save updated token
      - ./data:/app/data
      # Uncomment to enable /clean (LingoCleaner) — mount the 学外语 tree and point
      # LINGO_BASE_DIR at the in-container path (see cmd/translate_server/lingo.go).
      # - "${LINGO_BASE_DIR}:/app/lingo"
    networks:
      - lexica-net
    restart: unless-stopped

networks:
  lexica-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
